<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMU Report</title>
    <style>
        :root { --primary: #004085; --secondary: #0056b3; --bg: #f4f6f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; background: var(--bg); color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        
        /* Contrôles (Cachés à l'impression) */
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; background: #e9ecef; padding: 20px; border-radius: 8px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #495057; font-size: 0.9em; }
        input, button { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; }
        
        /* Boutons */
        .btn-action { border: none; font-weight: 700; cursor: pointer; height: 42px; transition: 0.2s; color: white; border-radius: 4px; }
        #fetchBtn { background: var(--primary); }
        #fetchBtn:hover { background: var(--secondary); }
        
        .action-bar { text-align: right; margin-bottom: 15px; display: none; } /* Caché par défaut */
        #exportBtn { background: #28a745; display: inline-block; width: auto; margin-left: 10px; padding: 0 20px; }
        #printBtn { background: #dc3545; display: inline-block; width: auto; margin-left: 10px; padding: 0 20px; }

        /* Carte Course */
        .race-card { border: 1px solid #dee2e6; border-radius: 6px; margin-bottom: 40px; background: white; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .race-header { background: var(--primary); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; -webkit-print-color-adjust: exact; }
        .race-title { font-size: 1.2em; font-weight: bold; }
        .race-body { padding: 20px; }

        /* Infos & Tables */
        .meta-box { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9em; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .conditions-text { grid-column: 1 / -1; border-top: 1px solid #dee2e6; padding-top: 10px; color: #555; font-style: italic; margin-top: 5px; }

        h4 { margin: 25px 0 10px 0; padding-bottom: 5px; border-bottom: 2px solid #e9ecef; color: var(--secondary); font-size: 1.1em; }

        table { width: 100%; border-collapse: collapse; font-size: 0.9em; margin-bottom: 10px; }
        th { background: #e2e6ea; text-align: left; padding: 8px; color: #495057; font-weight: 700; border: 1px solid #dee2e6; -webkit-print-color-adjust: exact; }
        td { padding: 8px; border: 1px solid #dee2e6; vertical-align: middle; }

        .reports-table th { background: #343a40; color: white; }
        .gain-cell { color: #d63384; font-weight: bold; font-size: 1.1em; }

        .participants-table th { background: #0056b3; color: white; }
        .participants-table tr:nth-child(even) { background-color: #f8f9fa; }
        
        /* Badges */
        .badge { padding: 3px 8px; border-radius: 3px; color: white; font-size: 0.8em; font-weight: bold; -webkit-print-color-adjust: exact; }
        .badge-win { background: #28a745; }
        .badge-place { background: #17a2b8; }
        .badge-couple { background: #ffc107; color: #333; }
        .badge-trio { background: #fd7e14; }

        #status { padding: 15px; text-align: center; border-radius: 4px; margin-bottom: 20px; display: none; font-weight: 500; }
        .status-loading { background: #cce5ff; color: #004085; }
        .status-error { background: #f8d7da; color: #721c24; }

        /* --- STYLES POUR L'IMPRESSION (PDF) --- */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; padding: 0; margin: 0; }
            .controls, .action-bar, #status { display: none !important; }
            .race-card { break-inside: avoid; border: 1px solid #000; margin-bottom: 20px; box-shadow: none; }
            .race-header { background: #ccc !important; color: black !important; border-bottom: 1px solid #000; }
            th { color: black !important; font-weight: bold; border: 1px solid #000; }
            td { border: 1px solid #000; }
            h2 { font-size: 16pt; text-align: center; }
            a { text-decoration: none; color: black; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-top:0; color:#004085; border-bottom:2px solid #004085; padding-bottom:15px;">PMU : Programme Officiel</h2>
        
        <div class="controls">
            <div class="form-group">
                <label>Date (JJMMAAAA)</label>
                <input type="text" id="dateInput" placeholder="ex: 07012026" maxlength="8">
            </div>
            <div class="form-group">
                <label>Réunion</label>
                <input type="text" id="reunionInput" placeholder="ex: R1" maxlength="3">
            </div>
            <div class="form-group" style="display:flex; align-items:end;">
                <button id="fetchBtn" class="btn-action">CHARGER LES DONNÉES</button>
            </div>
        </div>

        <div id="status"></div>
        
        <div id="actionBar" class="action-bar">
            <button id="exportBtn" class="btn-action">⬇ JSON</button>
            <button id="printBtn" class="btn-action">🖨️ Enregistrer PDF</button>
        </div>
        
        <div id="resultsContainer"></div>
    </div>
    <script src="scriptpmu.js"></script>
</body>
</html>
