<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMU Pro - Rapports & Terrain</title>
    <style>
        :root { --primary: #004085; --bg: #f4f6f9; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: var(--bg); color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Contrôles */
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; background: #e9ecef; padding: 15px; border-radius: 6px; }
        input, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        #exportBtn { background: #28a745; margin-top: 10px; display: none; }

        /* Carte Course */
        .race-card { border: 1px solid #ddd; border-radius: 6px; margin-bottom: 20px; background: white; overflow: hidden; }
        .race-header { background: #004085; color: white; padding: 10px 15px; display: flex; justify-content: space-between; font-weight: bold; }
        .race-body { padding: 15px; }

        /* Infos Terrain & Conditions */
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; font-size: 0.9em; background: #f8f9fa; padding: 10px; border-radius: 4px; }
        .meta-item strong { color: #555; }
        .condition-badge { display: inline-block; background: #e2e6ea; padding: 2px 6px; border-radius: 3px; font-size: 0.85em; margin-right: 5px; margin-bottom: 5px; }

        /* Tableau Rapports */
        .reports-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        .reports-table th { background: #eee; text-align: left; padding: 6px; border: 1px solid #ddd; }
        .reports-table td { padding: 6px; border: 1px solid #ddd; }
        .gain-cell { color: #d63384; font-weight: bold; }

        /* Badges Paris */
        .tag { padding: 2px 6px; border-radius: 3px; color: white; font-size: 0.8em; font-weight: bold; }
        .tag-win { background: #28a745; }
        .tag-place { background: #17a2b8; }
        .tag-couple { background: #ffc107; color: #333; }
        .tag-trio { background: #fd7e14; }

        details { margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        .status-msg { padding: 10px; margin: 10px 0; border-radius: 4px; display: none; text-align: center; }
        .status-loading { background: #cce5ff; color: #004085; }
        .status-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-top:0; border-bottom:2px solid #004085; padding-bottom:10px;">PMU : Rapports & Terrain</h2>
        
        <div class="controls">
            <div><label>Date (JJMMAAAA)</label><input type="text" id="dateInput" placeholder="ex: 16022020"></div>
            <div><label>Réunion</label><input type="text" id="reunionInput" placeholder="ex: R1"></div>
            <div style="display:flex; align-items:end;"><button id="fetchBtn">CHARGER</button></div>
        </div>

        <div id="status" class="status-msg"></div>
        <button id="exportBtn">⬇ Télécharger JSON complet</button>
        <div id="resultsContainer"></div>
    </div>
    <script src="scriptpmu.js"></script>
</body>
</html>
