<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrice Comparative C1 - Français ↔ Catalan</title>
    <style>
        :root {
            --bg-color: #0D0D0D;
            --text-color: #E8E0D0;
            --header-bg: rgba(13, 13, 13, 0.95);
            --border-color: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.025);
            --card-border: rgba(255, 255, 255, 0.07);
            --input-bg: rgba(255, 255, 255, 0.04);
            --font-main: 'Georgia', 'Times New Roman', serif;
            --font-mono: monospace;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            position: relative;
            overflow-x: hidden;
        }

        .bg-texture {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 20%, rgba(74,144,217,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(231,76,60,0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
        }

        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .header-left { display: flex; flex-direction: column; gap: 4px; }
        .flag-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .flag-chip {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: 1px;
        }
        .flag-sep { color: #555; font-size: 14px; }
        .title {
            margin: 0;
            font-size: clamp(18px, 4vw, 26px);
            font-weight: 400;
            letter-spacing: 0.02em;
            color: #F5F0E8;
        }
        .subtitle {
            margin: 0;
            font-size: 14px;
            color: #666;
            font-family: var(--font-mono);
            letter-spacing: 0.05em;
        }

        .toggle-btn {
            display: block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: 0.05em;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .controls {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 24px 0;
            position: relative;
            z-index: 10;
        }

        .search-wrap {
            position: relative;
            margin-bottom: 12px;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #555;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 17px;
            padding: 12px 40px 12px 44px;
            outline: none;
            font-family: var(--font-main);
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-bottom: 16px;
        }
        .filter-btn {
            background: var(--input-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: #888;
            font-size: 14px;
            padding: 5px 14px;
            cursor: pointer;
            font-family: var(--font-mono);
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .filter-btn.active {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
            color: #F5F0E8;
        }
        .filter-count {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 10px;
        }

        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 40px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .card-header {
            width: 100%;
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px 0 0;
            text-align: left;
            gap: 12px;
        }

        .card-header-left {
            display: flex;
            align-items: stretch;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }
        .color-bar {
            width: 4px;
            flex-shrink: 0;
            border-radius: 0 2px 2px 0;
        }
        .card-meta {
            padding: 16px 0;
            flex: 1;
            min-width: 0;
        }
        .card-top-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .system-label {
            font-size: 12px;
            color: #555;
            font-family: var(--font-mono);
            letter-spacing: 0.1em;
        }
        .tag {
            font-size: 12px;
            font-family: var(--font-mono);
            letter-spacing: 0.08em;
            border: 1px solid;
            border-radius: 4px;
            padding: 1px 7px;
            font-weight: 700;
        }
        .card-title {
            margin: 0 0 6px;
            font-size: clamp(18px, 3vw, 22px);
            font-weight: 400;
            color: #F0EAE0;
            letter-spacing: 0.01em;
        }
        .card-pattern {
            margin: 0;
            font-size: 14px;
            color: #666;
            font-family: var(--font-mono);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pattern-label { color: #444; }
        .chevron {
            font-size: 18px;
            color: #444;
            flex-shrink: 0;
            transition: transform 0.25s;
            user-select: none;
        }

        .card-body {
            padding: 0 20px 20px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .piege {
            display: flex;
            gap: 12px;
            background: rgba(231,76,60,0.08);
            border: 1px solid rgba(231,76,60,0.25);
            border-radius: 8px;
            padding: 12px 16px;
            margin: 16px 0;
            align-items: flex-start;
        }
        .piege-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
        .piege-text {
            margin: 0;
            font-size: 15px;
            color: #E8A090;
            line-height: 1.6;
            font-family: var(--font-main);
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }
        @media (max-width: 600px) {
            .two-col { grid-template-columns: 1fr; }
        }

        .section-title {
            margin: 0 0 10px;
            font-size: 15px;
            color: #888;
            font-family: var(--font-mono);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 1px solid;
            padding-bottom: 6px;
        }
        .rule-text {
            margin: 0;
            font-size: 16px;
            line-height: 1.7;
            color: #C8C0B0;
            font-family: var(--font-main);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .verb-section { margin-top: 20px; }
        .verb-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .verb-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
            font-size: 15px;
            align-items: center;
        }
        .verb-fr { color: #AAD4FF; font-style: italic; }
        .verb-ca { color: #FCDD09; font-style: italic; }
        .verb-en { color: #666; font-family: var(--font-mono); font-size: 14px; }

        footer {
            text-align: center;
            padding: 24px;
            color: #333;
            font-size: 14px;
            font-family: var(--font-mono);
            letter-spacing: 0.08em;
            border-top: 1px solid rgba(255,255,255,0.04);
            position: relative;
            z-index: 10;
        }

        .hidden { display: none !important; }
        .empty {
            text-align: center;
            padding: 60px 0;
            color: #444;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="bg-texture"></div>

    <header>
        <div class="header-inner">
            <div class="header-left">
                <div class="flag-bar">
                    <span class="flag-chip" style="background: #002395; color: white;">FR</span>
                    <span class="flag-sep">↔</span>
                    <span class="flag-chip" style="background: #FCDD09; color: #003399;">CA</span>
                </div>
                <h1 class="title">Matrice Comparative C1</h1>
                <p class="subtitle" id="stats-subtitle"></p>
            </div>
            <div class="toggle-wrap">
                <button id="toggle-ca" class="toggle-btn"></button>
            </div>
        </div>
    </header>

    <div class="controls">
        <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" id="search-input" class="search-input" placeholder="Rechercher un temps, un verbe, une règle...">
            <button id="clear-search" class="clear-btn hidden">×</button>
        </div>
        <div class="filter-row" id="filter-row"></div>
    </div>

    <div class="content" id="card-container"></div>

    <footer id="footer"></footer>

    <script>
        const DATA = [
            {
                id: "present",
                system: "indicatif",
                name: "Présent de l'Indicatif",
                tag: "BASE",
                color: "#4A90D9",
                rule: `Formation par 3 groupes :\n• Groupe 1 (-ER) : radical + -e, -es, -e, -ons, -ez, -ent\n• Groupe 2 (-IR régulier) : radical + -is, -is, -it, -issons, -issez, -issent\n• Groupe 3 (irréguliers) : patterns propres à chaque verbe`,
                pattern: "Radical + Terminaison (-e / -is / variable)",
                catalan: `Équivalent direct. Même usage.\n• Groupe 1 (-AR) : parl-o, parl-es, parl-a, parl-em, parl-eu, parl-en\n• Groupe 2 (-IR) : tem-o, tem-s, tem, tem-em, tem-eu, tem-en\n⚠️ Accent tonique identique mais orthographe diverge`,
                piege: null,
                verbs: [
                    { fr: "je parle", ca: "jo parlo", en: "I speak" },
                    { fr: "tu finis", ca: "tu acabes", en: "you finish" },
                    { fr: "il vend", ca: "ell ven", en: "he sells" },
                    { fr: "nous allons", ca: "nosaltres anem", en: "we go" },
                    { fr: "vous êtes", ca: "vosaltres sou", en: "you are" },
                    { fr: "ils font", ca: "ells fan", en: "they do" },
                    { fr: "je suis", ca: "jo sóc", en: "I am" },
                    { fr: "tu as", ca: "tu tens", en: "you have" },
                    { fr: "elle veut", ca: "ella vol", en: "she wants" },
                    { fr: "nous pouvons", ca: "nosaltres podem", en: "we can" },
                    { fr: "ils prennent", ca: "ells prenen", en: "they take" },
                    { fr: "je viens", ca: "jo vinc", en: "I come" },
                ],
            },
            {
                id: "imparfait",
                system: "indicatif",
                name: "Imparfait",
                tag: "DURÉE",
                color: "#7B68EE",
                rule: `Radical de la 1ère pers. pluriel du présent + terminaisons :\n-ais, -ais, -ait, -ions, -iez, -aient\n\nUsages :\n• Description dans le passé (état, habitude)\n• Action en cours interrompue\n• Politesse atténuante (je voulais vous demander...)`,
                pattern: "Rad. présent (nous) + -AIS / -AIS / -AIT / -IONS / -IEZ / -AIENT",
                catalan: `Correspondance : Imperfet d'indicatiu\n• Groupe -AR : parl-ava, parl-aves, parl-ava, parl-àvem, parl-àveu, parl-aven\n• Groupe -ER/-IR : tem-ia, tem-ies, tem-ia, tem-íem, tem-íeu, tem-ien\n⚠️ Terminaison FR -ais ≠ CA -ava/-ia : ne pas confondre les patterns !`,
                piege: "Attention : l'imparfait FR = -ais (toujours), jamais -ava. Le -ava catalan n'existe pas en français.",
                verbs: [
                    { fr: "je parlais", ca: "jo parlava", en: "I was speaking" },
                    { fr: "tu finissais", ca: "tu acabaves", en: "you were finishing" },
                    { fr: "il vendait", ca: "ell venia", en: "he was selling" },
                    { fr: "nous allions", ca: "nosaltres anàvem", en: "we were going" },
                    { fr: "vous étiez", ca: "vosaltres éreu", en: "you were" },
                    { fr: "ils faisaient", ca: "ells feien", en: "they were doing" },
                    { fr: "j'avais", ca: "jo tenia", en: "I had" },
                    { fr: "elle pouvait", ca: "ella podia", en: "she could" },
                    { fr: "nous voulions", ca: "nosaltres volíem", en: "we wanted" },
                    { fr: "ils prenaient", ca: "ells prenien", en: "they were taking" },
                ],
            },
            {
                id: "passe-compose",
                system: "indicatif",
                name: "Passé Composé",
                tag: "ACTION RÉVOLUE",
                color: "#E67E22",
                rule: `Auxiliaire (ÊTRE ou AVOIR) au présent + Participe Passé\n\nRègle ÊTRE : Dr & Mrs Vandertramp + tous les pronominaux\n(Devenir, Revenir, Mourir, Retourner, Sortir, Venir, Aller, Naître, Descendre, Entrer, Rentrer, Tomber, Rester, Arriver, Monter, Partir)\n\nAccord PP avec ÊTRE : PP s'accorde avec le sujet\nAccord PP avec AVOIR : PP s'accorde avec le COD si placé avant`,
                pattern: "AVOIR/ÊTRE (présent) + Participe Passé",
                catalan: `Équivalent : Pretèrit perfet perifràstic (le plus courant à l'oral)\n• Auxiliaire : anar (aller au présent — usage unique au catalan !)\n  jo vaig parlar / tu vas parlar / ell va parlar\n  nosaltres vam parlar / vosaltres vau parlar / ells van parlar\n⚠️ DIFFÉRENCE MAJEURE : CA utilise «anar» comme auxiliaire, FR utilise «avoir/être»`,
                piege: "Le choix ÊTRE/AVOIR est un piège majeur. En catalan, on n'a pas ce choix. En français, confondre les deux change le sens (il est monté = mouvement / il a monté = a transporté).",
                verbs: [
                    { fr: "j'ai parlé", ca: "jo vaig parlar", en: "I spoke" },
                    { fr: "tu as fini", ca: "tu vas acabar", en: "you finished" },
                    { fr: "il est allé", ca: "ell va anar", en: "he went" },
                    { fr: "elle est née", ca: "ella va néixer", en: "she was born" },
                    { fr: "nous avons fait", ca: "nosaltres vam fer", en: "we did" },
                    { fr: "vous êtes partis", ca: "vosaltres vau partir", en: "you left" },
                    { fr: "ils ont pris", ca: "ells van prendre", en: "they took" },
                    { fr: "je me suis levé(e)", ca: "jo em vaig aixecar", en: "I got up" },
                    { fr: "tu t'es souvenu(e)", ca: "tu et vas recordar", en: "you remembered" },
                    { fr: "il est tombé", ca: "ell va caure", en: "he fell" },
                ],
            },
            {
                id: "passe-simple",
                system: "indicatif",
                name: "Passé Simple",
                tag: "LITTÉRAIRE",
                color: "#8B4513",
                rule: `Temps littéraire (récit écrit, roman, presse soutenue). Jamais à l'oral.\n\nTerminaisons :\n• Groupe 1 (-ER) : -ai, -as, -a, -âmes, -âtes, -èrent\n• Groupe 2 (-IR) : -is, -is, -it, -îmes, -îtes, -irent\n• Groupe 3 irrég. : -us, -us, -ut, -ûmes, -ûtes, -urent\n\nMême valeur que le passé composé mais en registre soutenu.`,
                pattern: "Rad. + -AI/-IS/-US | -AS/-IS/-US | -A/-IT/-UT | ...",
                catalan: `Équivalent : Pretèrit indefinit (RARE au catalan moderne, surtout à l'écrit)\n• Groupe -AR : parl-í, parl-ares, parl-à, parl-àrem, parl-àreu, parl-aren\n• Groupe -IR : tem-í, tem-eres, tem-é, tem-érem, tem-éreu, tem-eren\n⚠️ En catalan moderne, ce temps est quasi remplacé par le perifràstic à l'écrit aussi`,
                piege: "Ne jamais utiliser le passé simple à l'oral en français — c'est une erreur de registre très marquée. En catalan, même remarque mais encore plus prononcée.",
                verbs: [
                    { fr: "je parlai", ca: "jo parlí", en: "I spoke (literary)" },
                    { fr: "tu finis", ca: "tu temeres", en: "you finished" },
                    { fr: "il vint", ca: "ell vingué", en: "he came" },
                    { fr: "elle eut", ca: "ella hagué", en: "she had" },
                    { fr: "nous fûmes", ca: "nosaltres fórem", en: "we were" },
                    { fr: "ils prirent", ca: "ells prengueren", en: "they took" },
                    { fr: "je dus", ca: "jo haguí de", en: "I had to" },
                    { fr: "il mourut", ca: "ell morí", en: "he died" },
                    { fr: "elle naquit", ca: "ella nasqué", en: "she was born" },
                    { fr: "ils surent", ca: "ells saberen", en: "they knew" },
                ],
            },
            {
                id: "plus-que-parfait",
                system: "indicatif",
                name: "Plus-que-parfait",
                tag: "ANTÉRIORITÉ",
                color: "#9B59B6",
                rule: `Imparfait de l'auxiliaire + Participe Passé\n\nExprime une action ANTÉRIEURE à une autre action passée.\n• «Quand il arriva, elle ÉTAIT PARTIE» (partie avant son arrivée)\n• Utilisé en discours indirect pour le passé du passé\n• Condition irréelle dans le passé (si + PQP → Cond. Passé)`,
                pattern: "AVOIR/ÊTRE (imparfait) + Participe Passé",
                catalan: `Équivalent : Pretèrit plusquamperfet\n• Auxiliaire haver à l'imperfet : havia / havies / havia / havíem / havíeu / havien\n  jo havia parlat / tu havies acabat / ell havia fet\n✓ Structure identique à la logique française — transfert direct possible`,
                piege: null,
                verbs: [
                    { fr: "j'avais parlé", ca: "jo havia parlat", en: "I had spoken" },
                    { fr: "tu avais fini", ca: "tu havies acabat", en: "you had finished" },
                    { fr: "il était allé", ca: "ell havia anat", en: "he had gone" },
                    { fr: "nous avions fait", ca: "nosaltres havíem fet", en: "we had done" },
                    { fr: "vous étiez partis", ca: "vosaltres havíeu marxat", en: "you had left" },
                    { fr: "ils avaient pris", ca: "ells havien pres", en: "they had taken" },
                    { fr: "elle s'était levée", ca: "ella s'havia aixecat", en: "she had gotten up" },
                    { fr: "j'avais voulu", ca: "jo havia volgut", en: "I had wanted" },
                    { fr: "tu avais su", ca: "tu havies sabut", en: "you had known" },
                    { fr: "il avait dû", ca: "ell havia hagut de", en: "he had had to" },
                ],
            },
            {
                id: "passe-anterieur",
                system: "indicatif",
                name: "Passé Antérieur",
                tag: "LITTÉRAIRE",
                color: "#6C3483",
                rule: `Passé simple de l'auxiliaire + Participe Passé\n\nUsage EXCLUSIVEMENT littéraire. Exprime une action passée immédiatement antérieure à une autre au passé simple.\n\nTrigger : après «quand», «dès que», «aussitôt que», «lorsque» + Passé Simple dans la principale\n\nEx : «Dès qu'il EUT FINI, il partit.»`,
                pattern: "AVOIR/ÊTRE (passé simple) + Participe Passé",
                catalan: `Équivalent : Pretèrit anterior (également littéraire et rare)\n• hagui/hagueres/hagué parlat...\n⚠️ Même rareté qu'en français — usage quasi exclusivement littéraire des deux côtés`,
                piege: "Ce temps n'existe qu'à l'écrit littéraire. L'objectif C1 est la RECONNAISSANCE, pas la production active.",
                verbs: [
                    { fr: "j'eus parlé", ca: "jo haguí parlat", en: "I had spoken (lit.)" },
                    { fr: "tu eus fini", ca: "tu hagueres acabat", en: "you had finished" },
                    { fr: "il eut fait", ca: "ell hagué fet", en: "he had done" },
                    { fr: "elle fut partie", ca: "ella hagué marxat", en: "she had left" },
                    { fr: "nous eûmes pris", ca: "nosaltres haguérem pres", en: "we had taken" },
                    { fr: "ils eurent su", ca: "ells hagueren sabut", en: "they had known" },
                ],
            },
            {
                id: "futur-simple",
                system: "indicatif",
                name: "Futur Simple",
                tag: "PROJECTION",
                color: "#27AE60",
                rule: `Infinitif + Terminaisons : -ai, -as, -a, -ons, -ez, -ont\n\n⚠️ Verbes irréguliers (infinitif modifié) :\nêtre → ser- | avoir → aur- | aller → ir- | faire → fer-\nvouloir → voudr- | pouvoir → pourr- | venir → viendr-\ndevoir → devr- | savoir → saur- | voir → verr-\n\nUsages : événement futur, ordre atténué, certitude`,
                pattern: "INFINITIF + -AI / -AS / -A / -ONS / -EZ / -ONT",
                catalan: `Équivalent : Futur simple\n• Groupe -AR : parl-aré, parl-aràs, parl-arà, parl-arem, parl-areu, parl-aran\n• Groupe -ER/-IR : tem-eré, tem-eràs, tem-erà...\n✓ Même logique : base + terminaisons\n⚠️ Différence : en catalan moderne, le futur est souvent remplacé par «anar a + infinitif» à l'oral`,
                piege: null,

                btn.className = `filter-btn ${activeSystem === s.id ? 'active' : ''}`;
                btn.innerHTML = `${s.label}${s.id !== 'all' ? ` <span class="filter-count">${counts[s.id] || 0}</span>` : ''}`;
                btn.onclick = () => {
                    activeSystem = s.id;
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    render();
                };
                filterRow.appendChild(btn);
            });
        }

        function toggleOpen(id) {
            if (openIds.has(id)) openIds.delete(id);
            else openIds.add(id);
            render();
        }

        function render() {
            // Update Toggle Button
            toggleCABtn.style.background = showCA ? "#FCDD09" : "#333";
            toggleCABtn.style.color = showCA ? "#003399" : "#aaa";
            toggleCABtn.innerText = showCA ? "🇪🇸 CA visible" : "🇪🇸 CA masqué";

            // Filter Data
            const filtered = DATA.filter(item => {
                const matchSystem = activeSystem === "all" || item.system === activeSystem;
                const q = search.toLowerCase();
                const matchSearch = !q || 
                    item.name.toLowerCase().includes(q) ||
                    item.rule.toLowerCase().includes(q) ||
                    item.pattern.toLowerCase().includes(q) ||
                    item.verbs.some(v => 
                        v.fr.toLowerCase().includes(q) || 
                        v.ca.toLowerCase().includes(q) || 
                        v.en.toLowerCase().includes(q)
                    );
                return matchSystem && matchSearch;
            });

            // Update Subtitle
            statsSubtitle.innerText = `Encyclopédie grammaticale · Français ↔ Catalan · ${DATA.length} fiches`;
            footer.innerText = `Matrice C1 · ${DATA.length} temps & structures · Préparation DALF C1`;

            // Render Cards
            cardContainer.innerHTML = "";
            if (filtered.length === 0) {
                cardContainer.innerHTML = `<div class="empty"><p>Aucun résultat pour «${search}»</p></div>`;
                return;
            }

            filtered.forEach(item => {
                const isOpen = openIds.has(item.id);
                const card = document.createElement('div');
                card.className = "card";
                
                let verbsHtml = item.verbs.map(v => `
                    <div class="verb-row">
                        <span class="verb-fr">${v.fr}</span>
                        ${showCA ? `<span class="verb-ca">${v.ca}</span>` : ''}
                        <span class="verb-en">${v.en}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <button class="card-header" onclick="toggleOpen('${item.id}')">
                        <div class="card-header-left">
                            <div class="color-bar" style="background: ${item.color}"></div>
                            <div class="card-meta">
                                <div class="card-top-row">
                                    <span class="system-label">${item.system.toUpperCase()}</span>
                                    <span class="tag" style="border-color: ${item.color}; color: ${item.color}">${item.tag}</span>
                                </div>
                                <h2 class="card-title">${item.name}</h2>
                                <p class="card-pattern">
                                    <span class="pattern-label">Pattern : </span>
                                    ${item.pattern}
                                </p>
                            </div>
                        </div>
                        <span class="chevron" style="transform: rotate(${isOpen ? 180 : 0}deg)">▾</span>
                    </button>
                    <div class="card-body ${isOpen ? '' : 'hidden'}">
                        ${item.piege ? `
                            <div class="piege">
                                <span class="piege-icon">⚠️</span>
                                <p class="piege-text">${item.piege}</p>
                            </div>
                        ` : ''}
                        <div class="two-col">
                            <div class="rule-block">
                                <h3 class="section-title" style="border-color: ${item.color}">🇫🇷 Règle & Usage</h3>
                                <pre class="rule-text">${item.rule}</pre>
                            </div>
                            <div class="rule-block ${showCA ? '' : 'hidden'}">
                                <h3 class="section-title" style="border-color: #FCDD09">🇪🇸 Équivalent Catalan</h3>
                                <pre class="rule-text">${item.catalan}</pre>
                            </div>
                        </div>
                        <div class="verb-section">
                            <h3 class="section-title" style="border-color: ${item.color}">📋 Conjugaisons Modèles</h3>
                            <div class="verb-grid">
                                ${verbsHtml}
                            </div>
                        </div>
                    </div>
                `;
                cardContainer.appendChild(card);
            });
        }

        window.toggleOpen = toggleOpen;
        init();
    </script>
</body>
</html>
