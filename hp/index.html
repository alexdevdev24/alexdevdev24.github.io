<!DOCTYPE html>
<html lang="ca" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSwiss Finder – Hospitals Cat. B/C | Suïssa Romanda</title>
    <meta name="description" content="Eina professional de suport a la decisió per a metges buscant un lloc en medicina interna a la Suïssa Romanda.">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <div>
                <h1>MedSwiss <span style="color: var(--primary-color);">Finder</span></h1>
                <div class="header-subtitle">Medicina Interna Cat. B/C &bull; Suïssa Romanda</div>
            </div>
            <div class="header-actions">
                <button id="export-btn" class="icon-btn" onclick="exportCSV()" title="Exportar la llista filtrada en CSV">
                    <i class="fas fa-download"></i>
                </button>
                <button id="dark-toggle-btn" class="icon-btn" onclick="toggleDarkMode()" title="Mode fosc">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="logo-icon"><i class="fa-solid fa-hospital-user"></i></div>
            </div>
        </div>

        <!-- Search bar -->
        <div class="search-bar-wrap">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="search-input" class="search-input" placeholder="Cercar un hospital o una ciutat..." oninput="onSearchInput()">
            <button class="search-clear" id="search-clear" onclick="clearSearch()" style="display:none;">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Filters & Sorting -->
        <div class="filter-bar" id="hospital-filters">
            <div class="filter-row">
                <select id="filter-canton" class="filter-select">
                    <option value="all">Tots els cantons</option>
                    <option value="Vaud">Vaud</option>
                    <option value="Genève">Ginebra</option>
                    <option value="Valais">Valais</option>
                    <option value="Fribourg">Friburg</option>
                    <option value="Neuchâtel">Neuchâtel</option>
                    <option value="Jura">Jura i Jura Bernès</option>
                </select>
                <select id="filter-categorie" class="filter-select">
                    <option value="all">Totes les categories</option>
                    <option value="B">Categoria B</option>
                    <option value="C">Categoria C</option>
                </select>
            </div>
            <div class="filter-row filter-row-3">
                <select id="filter-accessibilite" class="filter-select">
                    <option value="all">Accessibilitat (Totes)</option>
                    <option value="Alta">Alta</option>
                    <option value="Mitjana">Mitjana</option>
                    <option value="Baixa">Baixa</option>
                </select>
                <select id="filter-langue" class="filter-select">
                    <option value="all">Idioma (Tots)</option>
                    <option value="B2">B2 mínim</option>
                    <option value="C1">C1 mínim</option>
                    <option value="B2/C1">B2/C1</option>
                </select>
                <select id="filter-voiture" class="filter-select">
                    <option value="all">Cotxe (Tots)</option>
                    <option value="necessaire">Cotxe necessari 🚗</option>
                    <option value="pas-necessaire">Sense cotxe ✅</option>
                </select>
                <select id="sort-hospitals" class="sort-select">
                    <option value="score">Millor Coincidència ★</option>
                    <option value="distance">Proximitat Aeroport</option>
                    <option value="alpha">Alfabètic</option>
                    <option value="default">Per defecte</option>
                </select>
            </div>
            <div class="filter-results-meta" id="results-count"></div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-container">
            <button class="tab-btn active" id="tab-hospitals" onclick="switchTab('hospitals')">
                <i class="fas fa-hospital-alt"></i> <span>Hospitals</span>
            </button>
            <button class="tab-btn" id="tab-airports" onclick="switchTab('airports')">
                <i class="fas fa-plane"></i> <span>Aeroports</span>
            </button>
            <button class="tab-btn" id="tab-favs" onclick="switchTab('favs')">
                <i class="fas fa-heart"></i> <span>Favorits</span>
            </button>
        </div>

        <div id="hospitals-list" class="list-content active"></div>
        <div id="airports-list" class="list-content" style="display:none;"></div>
        <div id="favs-list" class="list-content" style="display:none;"></div>
    </div>

    <!-- Map Toggle Button (Airbnb-style) -->
    <button id="map-toggle-btn" onclick="toggleMap()" title="Mostrar/amagar el mapa">
        <i class="fas fa-map-marked-alt"></i>
        <span id="map-toggle-label">Mostrar el mapa</span>
    </button>

    <!-- Map Panel -->
    <div id="map-panel">
        <div id="map"></div>
    </div>

    <!-- Leaflet Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <!-- Cover Letter Modal -->
    <div id="cover-letter-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2><i class="fas fa-robot"></i> Generador de Carta de Presentació amb IA</h2>
            <p>Genera una carta personalitzada per a <span id="modal-hospital-name">aquest hospital</span>.</p>
            
            <div class="form-group">
                <label for="api-key">Clau API (OpenAI/Gemini):</label>
                <input type="password" id="api-key" placeholder="sk-..." value="">
                <small>La teva clau mai s'emmagatzema en un servidor.</small>
            </div>

            <div class="form-group">
                <label for="user-name">El Teu Nom &amp; Cognom:</label>
                <input type="text" id="user-name" placeholder="Dr. Àlex...">
            </div>

            <div class="form-group">
                <label for="user-details">Els teus Punts Forts / Experiència:</label>
                <textarea id="user-details" placeholder="Any de graduació, especialitat desitjada, experiència prèvia..."></textarea>
            </div>

            <div class="form-group">
                <label for="model-select">Model:</label>
                <select id="model-select">
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    <option value="gemini-pro">Gemini Pro</option>
                </select>
            </div>

            <button id="generate-btn" class="generate-btn">
                <i class="fas fa-magic"></i> Generar la Carta
            </button>

            <div id="generation-result" class="result-area" style="display:none;">
                <h3>Resultat:</h3>
                <textarea id="final-letter" readonly></textarea>
                <button id="copy-btn" class="secondary-btn"><i class="fas fa-copy"></i> Copiar</button>
            </div>
        </div>
    </div>

    <!-- App Data & Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
