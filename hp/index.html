<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedSwiss Finder — Trouve ton hôpital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────── */
:root {
  --bg:        #f9f7f4;
  --surface:   #ffffff;
  --border:    #e8e3dc;
  --text:      #1a1714;
  --muted:     #7a7268;
  --light:     #b0a99f;
  --primary:   #1c4f8a;
  --primary-l: #e8f0fb;
  --success:   #0f7b55;
  --success-l: #e6f5ef;
  --warn:      #c45c00;
  --warn-l:    #fdf0e6;
  --danger:    #b91c1c;
  --danger-l:  #fef2f2;
  --gold:      #c49a22;
  --gold-l:    #fef9e7;
  --radius:    14px;
  --shadow:    0 2px 12px rgba(0,0,0,.07);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.10);
  font-family: 'Sora', sans-serif;
}
[data-theme="dark"] {
  --bg:      #111010;
  --surface: #1c1b1b;
  --border:  #2d2b29;
  --text:    #f0ece6;
  --muted:   #8a8178;
  --light:   #55504a;
}

* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); min-height:100vh; }

/* ─── LAYOUT ─────────────────────────────── */
.app { display:grid; grid-template-rows:auto 1fr; min-height:100vh; }

/* ─── HEADER ─────────────────────────────── */
header {
  padding:16px 32px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.logo { display:flex; align-items:center; gap:10px; }
.logo-mark {
  width:36px; height:36px; border-radius:10px;
  background:var(--primary); display:grid; place-items:center;
  color:#fff; font-size:17px;
}
.logo-text { font-size:1.1rem; font-weight:700; letter-spacing:-.02em; }
.logo-text span { color:var(--primary); }
.header-right { display:flex; align-items:center; gap:12px; }
.mode-badge {
  background:var(--primary-l); color:var(--primary);
  font-size:.72rem; font-weight:600; padding:4px 10px; border-radius:99px;
}
.dark-btn {
  background:none; border:1px solid var(--border);
  border-radius:8px; width:34px; height:34px;
  cursor:pointer; font-size:14px; color:var(--muted);
  display:grid; place-items:center; transition:.2s;
}
.dark-btn:hover { background:var(--border); color:var(--text); }

/* ─── HERO / WIZARD ──────────────────────── */
#wizard {
  padding:48px 32px;
  max-width:720px; margin:0 auto;
  text-align:center;
}
.hero-label {
  font-size:.78rem; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:var(--primary);
  margin-bottom:16px;
}
.hero-title {
  font-family:'Instrument Serif', serif;
  font-size:clamp(2rem,5vw,3rem); line-height:1.15;
  color:var(--text); margin-bottom:12px;
}
.hero-title em { font-style:italic; color:var(--primary); }
.hero-sub { font-size:.95rem; color:var(--muted); margin-bottom:40px; line-height:1.6; }

.wizard-steps { display:flex; flex-direction:column; gap:20px; text-align:left; }

.wizard-step {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius); padding:20px 22px;
  transition:border-color .2s;
}
.wizard-step:focus-within { border-color:var(--primary); }

.step-q {
  font-size:.8rem; font-weight:600; color:var(--muted);
  margin-bottom:12px; display:flex; align-items:center; gap:8px;
}
.step-num {
  width:22px; height:22px; border-radius:50%;
  background:var(--primary); color:#fff;
  font-size:.7rem; display:grid; place-items:center; flex-shrink:0;
}
.chip-row { display:flex; flex-wrap:wrap; gap:8px; }
.chip {
  padding:8px 16px; border-radius:99px; font-size:.82rem;
  font-weight:500; cursor:pointer; border:1.5px solid var(--border);
  background:var(--bg); color:var(--text);
  transition:all .15s; user-select:none;
}
.chip:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-l); }
.chip.selected { background:var(--primary); color:#fff; border-color:var(--primary); }

.cta-btn {
  margin-top:28px; width:100%;
  padding:16px; border-radius:var(--radius);
  background:var(--primary); color:#fff;
  font-family:inherit; font-size:1rem; font-weight:700;
  border:none; cursor:pointer; transition:all .2s;
  letter-spacing:-.01em;
}
.cta-btn:hover { background:#163d6e; transform:translateY(-1px); box-shadow:var(--shadow-lg); }

/* ─── RESULTS PAGE ───────────────────────── */
#results-page { display:block; }

.results-shell {
  max-width:1100px; margin:0 auto;
  padding:28px 24px;
  display:grid; grid-template-columns:260px 1fr; gap:24px;
  align-items:start;
}

/* ─── LEFT SIDEBAR (FILTERS) ─────────────── */
.filters-panel {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:20px;
  position:sticky; top:24px;
}
.filters-title {
  font-size:.7rem; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); margin-bottom:16px;
}
.filter-group { margin-bottom:20px; }
.filter-group-label {
  font-size:.78rem; font-weight:600; color:var(--text);
  margin-bottom:10px; display:flex; align-items:center; gap:6px;
}
.filter-group-label .dot {
  width:7px; height:7px; border-radius:50%; background:var(--primary); flex-shrink:0;
}
.filter-chips { display:flex; flex-wrap:wrap; gap:6px; }
.f-chip {
  padding:5px 12px; border-radius:99px; font-size:.75rem;
  font-weight:500; cursor:pointer; border:1px solid var(--border);
  background:var(--bg); color:var(--muted);
  transition:all .15s;
}
.f-chip:hover { color:var(--primary); border-color:var(--primary); }
.f-chip.on { background:var(--primary-l); color:var(--primary); border-color:var(--primary); font-weight:600; }

.reset-link {
  background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:.78rem; color:var(--muted);
  text-decoration:underline; padding:0; margin-top:8px;
}
.reset-link:hover { color:var(--danger); }

.back-btn {
  width:100%; padding:9px; border-radius:8px;
  background:none; border:1px solid var(--border);
  font-family:inherit; font-size:.82rem; color:var(--muted);
  cursor:pointer; margin-bottom:16px; transition:.2s;
}
.back-btn:hover { border-color:var(--primary); color:var(--primary); }

/* ─── MAIN RESULTS ───────────────────────── */
.results-main {}
.results-topbar {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px; flex-wrap:wrap; gap:10px;
}
.results-count { font-size:.9rem; color:var(--muted); }
.results-count strong { color:var(--text); }
.sort-row { display:flex; gap:8px; }
.sort-btn {
  padding:6px 14px; border-radius:8px; font-size:.78rem;
  font-weight:600; cursor:pointer; border:1px solid var(--border);
  background:var(--bg); color:var(--muted); font-family:inherit;
  transition:.15s;
}
.sort-btn.active { background:var(--text); color:var(--bg); border-color:var(--text); }

/* ─── HOSPITAL CARD (REDESIGNED) ────────── */
.hosp-card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius); padding:0;
  margin-bottom:14px; cursor:pointer; overflow:hidden;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
  display:grid; grid-template-columns:6px 1fr;
}
.hosp-card:hover { border-color:var(--primary); box-shadow:var(--shadow-lg); transform:translateY(-2px); }
.hosp-card.selected { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-l); }

.card-stripe { background:var(--border); }
.hosp-card.score-high .card-stripe { background:var(--success); }
.hosp-card.score-med  .card-stripe { background:var(--gold); }
.hosp-card.score-low  .card-stripe { background:var(--warn); }

.card-body { padding:18px 20px; }

/* Card top row */
.card-head {
  display:flex; align-items:flex-start;
  justify-content:space-between; gap:12px; margin-bottom:12px;
}
.card-name { font-size:1rem; font-weight:700; line-height:1.25; }
.card-loc { font-size:.78rem; color:var(--muted); margin-top:2px; }

.score-block { text-align:center; flex-shrink:0; }
.score-num {
  font-family:'Instrument Serif', serif;
  font-size:2rem; line-height:1; font-weight:400;
}
.score-high .score-num { color:var(--success); }
.score-med  .score-num { color:var(--gold); }
.score-low  .score-num { color:var(--warn); }
.score-lbl { font-size:.6rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-top:1px; }

/* Key facts row — THE MOST IMPORTANT CHANGE */
.key-facts {
  display:grid; grid-template-columns:repeat(4, 1fr);
  gap:1px; background:var(--border);
  border-radius:9px; overflow:hidden; margin-bottom:14px;
}
.fact {
  background:var(--bg); padding:10px 12px;
  display:flex; flex-direction:column; gap:3px;
}
.fact-icon { font-size:.85rem; }
.fact-val { font-size:.88rem; font-weight:700; line-height:1; }
.fact-key { font-size:.67rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }

/* Decision pills */
.decision-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.dpill {
  font-size:.72rem; font-weight:600; padding:4px 10px; border-radius:99px;
  display:flex; align-items:center; gap:4px;
}
.dpill.green  { background:var(--success-l); color:var(--success); }
.dpill.amber  { background:var(--gold-l);    color:var(--gold); }
.dpill.red    { background:var(--danger-l);  color:var(--danger); }
.dpill.blue   { background:var(--primary-l); color:var(--primary); }
.dpill.grey   { background:var(--bg); color:var(--muted); border:1px solid var(--border); }

/* Summary line */
.card-summary { font-size:.82rem; color:var(--muted); line-height:1.5; margin-bottom:14px; }

/* Card footer */
.card-foot {
  display:flex; gap:8px; border-top:1px solid var(--border);
  padding-top:12px;
}
.card-foot-btn {
  flex:1; padding:9px; border-radius:8px; font-size:.78rem;
  font-weight:600; cursor:pointer; font-family:inherit;
  border:1px solid var(--border); background:none; color:var(--muted);
  transition:.15s; display:flex; align-items:center; justify-content:center; gap:5px;
}
.card-foot-btn:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-l); }
.card-foot-btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.card-foot-btn.primary:hover { background:#163d6e; }
.fav-btn-sm {
  width:36px; height:36px; border-radius:8px; flex-shrink:0;
  background:none; border:1px solid var(--border); cursor:pointer;
  font-size:14px; transition:.15s; display:grid; place-items:center;
}
.fav-btn-sm:hover, .fav-btn-sm.on { background:var(--danger-l); border-color:var(--danger); color:var(--danger); }

/* ─── CANTON DIVIDER ─────────────────────── */
.canton-div {
  font-size:.7rem; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--border); padding-bottom:8px;
  margin-bottom:12px; margin-top:24px;
  display:flex; align-items:center; justify-content:space-between;
}
.canton-div:first-child { margin-top:0; }

/* ─── DETAIL PANEL (Right Drawer) ────────── */
#detail-panel {
  display:none;
  position:fixed; top:0; right:0; width:480px; height:100vh;
  background:var(--surface); border-left:1px solid var(--border);
  z-index:999; overflow-y:auto;
  box-shadow:-8px 0 40px rgba(0,0,0,.12);
  animation: slideIn .25s ease-out;
}
@keyframes slideIn { from { transform:translateX(100%); } to { transform:translateX(0); } }

.detail-hero {
  background:linear-gradient(135deg, var(--primary) 0%, #2563eb 100%);
  color:#fff; padding:32px 28px 24px;
  position:relative;
}
.detail-close {
  position:absolute; top:16px; right:16px;
  background:rgba(255,255,255,.2); border:none;
  border-radius:99px; width:32px; height:32px;
  color:#fff; cursor:pointer; font-size:16px; line-height:1;
  display:grid; place-items:center;
}
.detail-close:hover { background:rgba(255,255,255,.35); }
.detail-cat { font-size:.7rem; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; opacity:.75; margin-bottom:8px; }
.detail-name { font-family:'Instrument Serif', serif; font-size:1.8rem; line-height:1.2; margin-bottom:6px; }
.detail-loc { font-size:.9rem; opacity:.8; }
.detail-score { position:absolute; top:28px; right:28px;
  font-family:'Instrument Serif', serif; font-size:3rem;
  opacity:.25; line-height:1; }

.detail-body { padding:24px 28px; }
.detail-section { margin-bottom:24px; }
.detail-section-title {
  font-size:.68rem; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin-bottom:12px;
  display:flex; align-items:center; gap:8px;
}
.detail-section-title::after { content:''; flex:1; height:1px; background:var(--border); }

.detail-kv { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.kv { background:var(--bg); border-radius:9px; padding:12px 14px; }
.kv-val { font-size:.95rem; font-weight:700; color:var(--text); }
.kv-key { font-size:.7rem; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:.05em; }

.pros-cons { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.pros { background:var(--success-l); border-radius:9px; padding:14px; }
.cons { background:var(--danger-l); border-radius:9px; padding:14px; }
.pc-title { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
  margin-bottom:10px; }
.pros .pc-title { color:var(--success); }
.cons .pc-title { color:var(--danger); }
.pc-item { font-size:.8rem; line-height:1.5; padding:4px 0;
  display:flex; gap:6px; }
.pc-item::before { flex-shrink:0; }
.pros .pc-item::before { content:'✓'; color:var(--success); font-weight:700; }
.cons .pc-item::before { content:'✗'; color:var(--danger); font-weight:700; }

.expert-box {
  background:var(--primary-l); border-left:3px solid var(--primary);
  border-radius:0 9px 9px 0; padding:14px 16px;
  font-size:.85rem; color:var(--text); line-height:1.6; font-style:italic;
}

.detail-actions { display:flex; gap:10px; margin-top:8px; }
.det-btn {
  flex:1; padding:12px; border-radius:10px; font-size:.85rem;
  font-weight:700; cursor:pointer; font-family:inherit; border:none;
  transition:.2s;
}
.det-btn.primary { background:var(--primary); color:#fff; }
.det-btn.primary:hover { background:#163d6e; }
.det-btn.sec { background:var(--bg); color:var(--muted); border:1px solid var(--border); }
.det-btn.sec:hover { border-color:var(--primary); color:var(--primary); }

/* ─── OVERLAY ────────────────────────────── */
#overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:998; }
#overlay.on { display:block; }

/* ─── MATCH BANNER ───────────────────────── */
.match-banner {
  background:linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
  color:#fff; border-radius:var(--radius); padding:20px 24px;
  margin-bottom:20px; display:flex; align-items:center; gap:16px;
}
.match-icon { font-size:2rem; flex-shrink:0; }
.match-text h3 { font-size:1rem; font-weight:700; margin-bottom:3px; }
.match-text p { font-size:.82rem; opacity:.85; line-height:1.4; }
.match-close {
  margin-left:auto; flex-shrink:0; background:rgba(255,255,255,.2);
  border:none; border-radius:99px; width:28px; height:28px;
  color:#fff; cursor:pointer; font-size:14px; display:grid; place-items:center;
}

/* ─── DARK MODE ──────────────────────────── */
.dark-btn { font-size:16px; }

@media (max-width:768px) {
  .results-shell { grid-template-columns:1fr; }
  .filters-panel { display:none; }
  .key-facts { grid-template-columns:1fr 1fr; }
  #detail-panel { width:100%; }
  .pros-cons { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">
    <div class="logo-mark">🏥</div>
    <div class="logo-text">MedSwiss <span>Finder</span></div>
  </div>
  <div class="header-right">
    <div class="mode-badge">Médecine Interne B/C · Suisse Romande</div>
    <button class="dark-btn" onclick="toggleDark()" id="dark-btn">🌙</button>
  </div>
</header>



<!-- ═══ RESULTS ═══ -->
<div id="results-page">
  <div class="results-shell">

    <!-- LEFT: Filters -->
    <div>

      <div class="filters-panel">
        <div class="filters-title">Affiner</div>

        <div class="filter-group">
          <div class="filter-group-label"><div class="dot"></div> Canton</div>
          <div class="filter-chips" data-filter="canton">
            <div class="f-chip on" data-val="all" onclick="fchip(this,'canton')">Tous</div>
            <div class="f-chip" data-val="Vaud" onclick="fchip(this,'canton')">Vaud</div>
            <div class="f-chip" data-val="Genève" onclick="fchip(this,'canton')">Genève</div>
            <div class="f-chip" data-val="Valais" onclick="fchip(this,'canton')">Valais</div>
            <div class="f-chip" data-val="Fribourg" onclick="fchip(this,'canton')">Fribourg</div>
            <div class="f-chip" data-val="Neuchâtel" onclick="fchip(this,'canton')">Neuchâtel</div>
            <div class="f-chip" data-val="Jura" onclick="fchip(this,'canton')">Jura</div>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-group-label"><div class="dot"></div> Catégorie</div>
          <div class="filter-chips" data-filter="cat">
            <div class="f-chip on" data-val="all" onclick="fchip(this,'cat')">Toutes</div>
            <div class="f-chip" data-val="B" onclick="fchip(this,'cat')">Cat. B</div>
            <div class="f-chip" data-val="C" onclick="fchip(this,'cat')">Cat. C</div>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-group-label"><div class="dot"></div> Accessibilité étrangers</div>
          <div class="filter-chips" data-filter="acces">
            <div class="f-chip on" data-val="all" onclick="fchip(this,'acces')">Toutes</div>
            <div class="f-chip" data-val="Alta" onclick="fchip(this,'acces')">🟢 Haute</div>
            <div class="f-chip" data-val="Mittlana" onclick="fchip(this,'acces')">🟡 Moyenne</div>
            <div class="f-chip" data-val="Baixa" onclick="fchip(this,'acces')">🔴 Faible</div>
          </div>
        </div>

        <button class="reset-link" onclick="resetFilters()">Réinitialiser les filtres</button>
      </div>
    </div>

    <!-- RIGHT: Cards -->
    <div>


      <div class="results-topbar">
        <div class="results-count" id="result-count"><strong>—</strong> hôpitaux</div>
        <div class="sort-row">
          <button class="sort-btn active" onclick="setSort('score',this)">⭐ Match</button>
          <button class="sort-btn" onclick="setSort('airport',this)">✈️ Aéroport</button>
          <button class="sort-btn" onclick="setSort('alpha',this)">A–Z</button>
        </div>
      </div>

      <div id="cards-container"></div>
    </div>
  </div>
</div>

<!-- ═══ DETAIL PANEL ═══ -->
<div id="overlay" onclick="closeDetail()"></div>
<div id="detail-panel">
  <div class="detail-hero">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="detail-cat" id="dp-cat"></div>
    <div class="detail-name" id="dp-name"></div>
    <div class="detail-loc" id="dp-loc"></div>
    <div class="detail-score" id="dp-score"></div>
  </div>
  <div class="detail-body">
    <div class="detail-section">
      <div class="detail-section-title">Chiffres clés</div>
      <div class="detail-kv" id="dp-kv"></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Points forts &amp; défis</div>
      <div class="pros-cons" id="dp-proscons"></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Avis de l'expert</div>
      <div class="expert-box" id="dp-expert"></div>
    </div>
    <div class="detail-actions">
      <button class="det-btn primary" id="dp-apply-btn">📧 Postuler</button>
      <button class="det-btn sec" onclick="closeDetail()">Fermer</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
/* ─── DATA PREPARATION ───────────────────────────────────── */
function prepareHospitals() {
  const result = [];
  let id = 1;
  if (typeof HOSPITAL_DATA === 'undefined') return [];
  
  HOSPITAL_DATA.suisse_francophone.forEach(c => {
    c.hopitaux.forEach(h => {
      const site = h.sites[0];
      result.push({
        id: id++,
        nom: h.nom,
        canton: c.canton,
        ville: site.ville,
        cat: h.categorie,
        acces: h.accessibilite_etrangers === 'Mitjana' ? 'Mittlana' : h.accessibilite_etrangers,
        langue: h.langue_requise ? (h.langue_requise.includes('/') ? 'B2' : h.langue_requise) : 'B2',
        budget: site.budget_loyer,
        voiture: site.voiture_necessaire,
        housing: site.logement_personnel,
        supervision: h.supervision_score || 4.0,
        airport: h.aeroport_proche || 'GVA',
        temps: h.temps_aeroport || '1h',
        score: Math.round((h.supervision_score || 4.0) * 20),
        pros: h.points_forts || [],
        cons: h.points_faibles || [],
        expert: h.avis_expert || h.encadrement_desc || '',
        description: h.avis_assistant_resume || h.description || '',
        email: h.email_contact || ''
      });
    });
  });
  return result;
}

const HOSPITALS = prepareHospitals();


/* ─── STATE ──────────────────────────────── */
let wizState = { priority: null, langue: null, budget: null };
let filters  = { canton:'all', cat:'all', acces:'all' };
let sortMode = 'score';
let favs     = JSON.parse(localStorage.getItem('mswiss_favs') || '[]');
let activeDetail = null;



/* ─── FILTER CHIPS ───────────────────────── */
function fchip(el, group) {
  el.closest('[data-filter]').querySelectorAll('.f-chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  filters[group] = el.dataset.val;
  renderCards();
}

function resetFilters() {
  filters = { canton:'all', cat:'all', acces:'all' };
  document.querySelectorAll('.f-chip').forEach(c => {
    c.classList.toggle('on', c.dataset.val === 'all');
  });
  renderCards();
}

function setSort(mode, btn) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

/* ─── SCORE CALC ─────────────────────────── */
function computeScore(h) {
  let s = h.score; // base score

  // Boost from wizard priorities
  if (wizState.priority === 'supervision') s += h.supervision * 2;
  if (wizState.priority === 'barcelona')   s += h.temps.includes('15') ? 10 : h.temps.includes('20') ? 8 : h.temps.includes('30') ? 5 : 0;
  if (wizState.priority === 'housing' && h.housing) s += 15;
  if (wizState.priority === 'notcar' && !h.voiture) s += 12;
  if (wizState.langue === h.langue) s += 8;
  if (wizState.budget && wizState.budget !== 'any' && h.budget === wizState.budget) s += 5;

  return Math.min(Math.round(s), 100);
}

/* ─── FILTER & SORT ──────────────────────── */
function getFiltered() {
  return HOSPITALS.filter(h => {
    if (filters.canton !== 'all' && h.canton !== filters.canton) return false;
    if (filters.cat    !== 'all' && h.cat    !== filters.cat)    return false;
    if (filters.acces  !== 'all' && h.acces  !== filters.acces)  return false;
    // Wizard filters
    if (wizState.langue && wizState.langue !== 'both' && h.langue !== wizState.langue) return false;
    if (wizState.priority === 'housing' && !h.housing) return false;
    if (wizState.priority === 'notcar'  && h.voiture)  return false;
    if (wizState.budget && wizState.budget !== 'any' && h.budget > wizState.budget) return false;
    return true;
  }).sort((a, b) => {
    if (sortMode === 'score') return computeScore(b) - computeScore(a);
    if (sortMode === 'alpha') return a.nom.localeCompare(b.nom);
    if (sortMode === 'airport') return parseInt(a.temps) - parseInt(b.temps);
    return 0;
  });
}

/* ─── RENDER ─────────────────────────────── */
function renderCards() {
  const list = getFiltered();
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  document.getElementById('result-count').innerHTML =
    `<strong>${list.length}</strong> hôpital${list.length > 1 ? 'x' : ''}`;

  if (!list.length) {
    container.innerHTML = `<div style="text-align:center;padding:48px 0;color:var(--muted);">
      <div style="font-size:2.5rem;margin-bottom:12px;">🔍</div>
      <p>Aucun hôpital ne correspond.<br>Essaie d'élargir tes critères.</p>
      <button onclick="resetFilters()" style="margin-top:16px;padding:8px 20px;border-radius:8px;background:var(--primary);color:#fff;border:none;cursor:pointer;font-family:inherit;">Réinitialiser</button>
    </div>`;
    return;
  }

  // Group by canton
  const byC = {};
  list.forEach(h => { (byC[h.canton] = byC[h.canton] || []).push(h); });

  Object.entries(byC).forEach(([canton, hosps]) => {
    const div = document.createElement('div');
    div.className = 'canton-div';
    div.innerHTML = `${canton} <span>${hosps.length} hosp.</span>`;
    container.appendChild(div);

    hosps.forEach(h => container.appendChild(buildCard(h)));
  });
}

function buildCard(h) {
  const sc = computeScore(h);
  const cls = sc >= 85 ? 'score-high' : sc >= 75 ? 'score-med' : 'score-low';
  const faved = favs.includes(h.id);

  // Decision pills
  const pills = [];
  if (!h.voiture) pills.push({ label:'🚂 Sans voiture', cls:'green' });
  else            pills.push({ label:'🚗 Voiture nécessaire', cls:'amber' });
  if (h.housing)  pills.push({ label:'🏠 Logement fourni', cls:'blue' });
  if (h.acces === 'Alta')     pills.push({ label:'✅ Accueil étrangers', cls:'green' });
  if (h.acces === 'Mittlana') pills.push({ label:'⚠️ Accueil moyen', cls:'amber' });
  if (h.acces === 'Baixa')    pills.push({ label:'⛔ Difficile étrangers', cls:'red' });
  pills.push({ label:`🇫🇷 FR ${h.langue} min.`, cls: h.langue === 'B2' ? 'green' : 'amber' });

  const card = document.createElement('div');
  card.className = `hosp-card ${cls}`;
  card.id = `card-${h.id}`;
  card.innerHTML = `
    <div class="card-stripe"></div>
    <div class="card-body">
      <div class="card-head">
        <div>
          <div class="card-name">${h.nom}</div>
          <div class="card-loc">📍 ${h.ville} · Cat. ${h.cat}</div>
        </div>
        <div class="score-block ${cls}">
          <div class="score-num">${sc}</div>
          <div class="score-lbl">/ 100</div>
        </div>
      </div>

      <div class="key-facts">
        <div class="fact">
          <div class="fact-icon">✈️</div>
          <div class="fact-val">${h.temps}</div>
          <div class="fact-key">${h.airport} → BCN</div>
        </div>
        <div class="fact">
          <div class="fact-icon">💶</div>
          <div class="fact-val">${h.budget}</div>
          <div class="fact-key">Loyer</div>
        </div>
        <div class="fact">
          <div class="fact-icon">🎓</div>
          <div class="fact-val">${h.supervision}/5</div>
          <div class="fact-key">Encadrement</div>
        </div>
        <div class="fact">
          <div class="fact-icon">🇫🇷</div>
          <div class="fact-val">${h.langue}</div>
          <div class="fact-key">Français min.</div>
        </div>
      </div>

      <div class="decision-row">
        ${pills.map(p => `<div class="dpill ${p.cls}">${p.label}</div>`).join('')}
      </div>

      <p class="card-summary">${h.description}</p>

      <div class="card-foot">
        <button class="card-foot-btn primary" onclick="event.stopPropagation(); openDetail(${h.id})">Voir les détails →</button>
        <button class="card-foot-btn" onclick="event.stopPropagation(); window.open('mailto:${h.email}')">📧 Postuler</button>
        <button class="fav-btn-sm ${faved ? 'on' : ''}" onclick="event.stopPropagation(); toggleFav(${h.id}, this)" title="Favori">
          ${faved ? '❤️' : '🤍'}
        </button>
      </div>
    </div>`;

  card.onclick = () => openDetail(h.id);
  return card;
}

/* ─── DETAIL PANEL ───────────────────────── */
function openDetail(id) {
  const h  = HOSPITALS.find(x => x.id === id);
  const sc = computeScore(h);
  const cls = sc >= 85 ? 'score-high' : sc >= 75 ? 'score-med' : 'score-low';
  activeDetail = id;

  document.getElementById('dp-cat').textContent = `Cat. ${h.cat} · ${h.canton}`;
  document.getElementById('dp-name').textContent = h.nom;
  document.getElementById('dp-loc').textContent  = `📍 ${h.ville}`;
  document.getElementById('dp-score').textContent = sc;
  document.getElementById('dp-expert').textContent = h.expert;
  document.getElementById('dp-apply-btn').onclick = () => window.open(`mailto:${h.email}`);

  document.getElementById('dp-kv').innerHTML = `
    <div class="kv"><div class="kv-val">✈️ ${h.temps}</div><div class="kv-key">Aéroport ${h.airport}</div></div>
    <div class="kv"><div class="kv-val">💶 ${h.budget}</div><div class="kv-key">Loyer estimé</div></div>
    <div class="kv"><div class="kv-val">⭐ ${h.supervision}/5</div><div class="kv-key">Encadrement</div></div>
    <div class="kv"><div class="kv-val">🇫🇷 ${h.langue}</div><div class="kv-key">Français requis</div></div>
    <div class="kv"><div class="kv-val">${h.housing ? '✅ Oui' : '❌ Non'}</div><div class="kv-key">Logement fourni</div></div>
    <div class="kv"><div class="kv-val">${h.voiture ? '🚗 Oui' : '🚂 Non'}</div><div class="kv-key">Voiture nécessaire</div></div>
  `;

  document.getElementById('dp-proscons').innerHTML = `
    <div class="pros">
      <div class="pc-title">Points forts</div>
      ${h.pros.map(p => `<div class="pc-item">${p}</div>`).join('')}
    </div>
    <div class="cons">
      <div class="pc-title">Défis</div>
      ${h.cons.map(c => `<div class="pc-item">${c}</div>`).join('')}
    </div>`;

  const panel = document.getElementById('detail-panel');
  const ov    = document.getElementById('overlay');
  panel.style.display = 'block';
  ov.classList.add('on');

  // Highlight card
  document.querySelectorAll('.hosp-card').forEach(c => c.classList.remove('selected'));
  const card = document.getElementById(`card-${id}`);
  if (card) { card.classList.add('selected'); card.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
}

function closeDetail() {
  document.getElementById('detail-panel').style.display = 'none';
  document.getElementById('overlay').classList.remove('on');
  document.querySelectorAll('.hosp-card').forEach(c => c.classList.remove('selected'));
  activeDetail = null;
}

/* ─── FAVS ───────────────────────────────── */
function toggleFav(id, btn) {
  if (favs.includes(id)) { favs = favs.filter(f => f !== id); btn.textContent = '🤍'; btn.classList.remove('on'); }
  else                   { favs.push(id); btn.textContent = '❤️'; btn.classList.add('on'); }
  localStorage.setItem('mswiss_favs', JSON.stringify(favs));
}

/* ─── DARK MODE ──────────────────────────── */
function toggleDark() {
  const html = document.documentElement;
  const dark = html.dataset.theme === 'dark';
  html.dataset.theme = dark ? 'light' : 'dark';
  document.getElementById('dark-btn').textContent = dark ? '🌙' : '☀️';
  localStorage.setItem('mswiss_theme', html.dataset.theme);
}
(function() {
  const t = localStorage.getItem('mswiss_theme');
  if (t) { document.documentElement.dataset.theme = t; document.getElementById('dark-btn').textContent = t === 'dark' ? '☀️' : '🌙'; }
  renderCards();
})();
</script>
</body>
</html>
