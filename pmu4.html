<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner PMU - Data Split (Fix)</title>
    <style>
        :root { --primary: #2c3e50; --bg: #f0f2f5; --card: #ffffff; --btn-blue: #3498db; --btn-orange: #e67e22; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px; background: var(--bg); color: #333; font-size: 13px; }
        
        .container { max-width: 100%; margin: 0 auto; background: var(--card); padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .full-width { grid-column: 1 / -1; }
        label { display: block; font-weight: 700; margin-bottom: 2px; font-size: 0.75rem; color: #555; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; color: white; font-size: 0.9rem; margin-top: 5px; cursor: pointer; }
        #scanBtn { background: #27ae60; }
        #stopBtn { background: #c0392b; display: none; }
        
        .export-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-export-start { background: var(--btn-blue); }
        .btn-export-end { background: var(--btn-orange); }

        #statusLog { background: #222; color: #0f0; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 0.7rem; height: 40px; overflow: hidden; margin-bottom: 10px; white-space: nowrap; }
        .stats { display: flex; justify-content: space-between; background: #e9ecef; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-weight: bold; }

        .race-card { border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; background: #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-left: 5px solid var(--primary); }
        .race-header { font-weight: bold; font-size: 0.95rem; display: flex; justify-content: space-between; }
        .result-line { font-size: 1rem; font-weight: bold; color: #333; background: #f8f9fa; padding: 5px; border-radius: 4px; }
        .trio-highlight { color: #d63384; font-weight: bold; margin-top: 2px; font-size: 1.1rem; }

        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        .btn-mini { padding: 8px; border: none; border-radius: 4px; color: white; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .copy-start { background: var(--btn-blue); }
        .copy-end { background: var(--btn-orange); }

    </style>
</head>
<body>

<div class="container">
    <h2>Scanner PMU (Data Split)</h2>

    <div id="statusLog">Prêt.</div>

    <div class="stats">
        <span>Scan: <span id="sScan">0</span></span>
        <span>Trouvés: <span id="sFound" style="color:#e74c3c">0</span></span>
    </div>

    <div class="form-grid">
        <div><label>Début</label><input type="number" id="dStart" value="01122025" placeholder="JJMMAAAA"></div>
        <div><label>Fin</label><input type="number" id="dEnd" value="31122025" placeholder="JJMMAAAA"></div>
        <div class="full-width"><label>Hippodrome(s)</label><input type="text" id="fHippo" value="Cagnes, Pau"></div>
        <div><label>Seuil Trio (€)</label><input type="number" id="threshold" value="100"></div>
        <div><label>Pause (ms)</label><input type="number" id="speed" value="600"></div>
    </div>

    <button id="scanBtn" class="btn">LANCER LE SCAN</button>
    <button id="stopBtn" class="btn">STOPPER</button>

    <div class="export-group">
        <button id="dlStarts" class="btn btn-export-start" disabled>⬇ TOUS DÉPARTS</button>
        <button id="dlFinishes" class="btn btn-export-end" disabled>⬇ TOUTES ARRIVÉES</button>
    </div>

    <div id="resultsContainer" style="margin-top:20px;"></div>
</div>

<script>
/**
 * SCRIPT PMU DATA SPLIT - CORRIGÉ
 */

const PROXIES = [
    'https://corsproxy.io/?',
    'https://api.allorigins.win/raw?url=',
];
const API_BASE = 'https://online.turfinfo.api.pmu.fr/rest/client/1/programme';

let DATA_DEPART = [];
let DATA_ARRIVEE = [];
let RUNNING = false;

// DOM
const el = (id) => document.getElementById(id);
const log = (msg) => el("statusLog").innerText = msg;

// --- SCAN ---
el("scanBtn").onclick = async () => {
    const dStart = el("dStart").value;
    const dEnd = el("dEnd").value;
    const hippoFilter = el("fHippo").value.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
    const thresh = parseFloat(el("threshold").value);
    const delay = parseInt(el("speed").value);

    // Reset
    RUNNING = true;
    DATA_DEPART = [];
    DATA_ARRIVEE = [];
    el("resultsContainer").innerHTML = "";
    el("sScan").innerText = "0";
    el("sFound").innerText = "0";
    el("scanBtn").style.display = "none";
    el("stopBtn").style.display = "block";
    el("dlStarts").disabled = true;
    el("dlFinishes").disabled = true;

    const dates = getDates(dStart, dEnd);
    let scanCount = 0;
    let foundCount = 0;

    try {
        for (const date of dates) {
            if (!RUNNING) break;

            for (let r = 1; r <= 6; r++) {
                if (!RUNNING) break;

                log(`Check: ${date} R${r}`);
                await sleep(delay);

                // 1. Programme
                const prog = await fetchSafe(`${API_BASE}/${date}/R${r}`);
                if (!prog || !prog.courses) continue;

                const hName = (prog.hippodrome?.libelleLong + " " + prog.hippodrome?.libelleCourt).toLowerCase();
                const match = hippoFilter.length === 0 || hippoFilter.some(k => hName.includes(k));
                if (!match) continue;

                // 2. Courses
                for (const c of prog.courses) {
                    if (c.statut === "COURSE_ANNULEE") continue;
                    
                    scanCount++;
                    el("sScan").innerText = scanCount;

                    await sleep(delay / 2);
                    const rap = await fetchSafe(`${API_BASE}/${date}/R${r}/C${c.numOrdre}/rapports-definitifs`);

                    if (hasTrio(rap) && isHighTrio(rap, thresh)) {
                        foundCount++;
                        el("sFound").innerText = foundCount;
                        log(`>>> RETENU: R${r}C${c.numOrdre}`);

                        // Récupération Partants
                        const part = await fetchSafe(`${API_BASE}/${date}/R${r}/C${c.numOrdre}/participants`);
                        
                        // --- PREPARATION DONNEES DEPART ---
                        const participantsInfo = (part?.participants || []).map(p => ({
                            num: p.numPmu,
                            nom: p.nomCheval || p.nom,
                            driver: p.driver || p.jockey || "-",
                            entraineur: p.entraineur || "-",
                            proprietaire: p.proprietaire || "-",
                            musique: p.musique || "-",
                            sexe: p.sexe || "-",
                            age: p.age || "-",
                            race: p.race || "-",
                            oeilleres: p.oeilleres || "-",
                            poids: p.poidsCondition || p.poids || "-",
                            valeur: p.valeurHandicap || "-",
                            gains: p.gainsParticipant || p.gainsCarriere || "-",
                            cote_reference: p.dernierRapportDirect ? p.dernierRapportDirect.rapport : "-"
                        }));

                        const infosCourse = {
                            id: `R${r}C${c.numOrdre}`,
                            date: date,
                            hippodrome: prog.hippodrome?.libelleCourt,
                            nom_prix: c.libelle,
                            infos_tech: {
                                discipline: c.discipline,
                                distance: c.distance,
                                corde: c.corde || "-",
                                terrain: c.etatTerrain || "Inconnu",
                                penetrometre: c.valeurPenetrometre || "-"
                            },
                            conditions_txt: (Array.isArray(c.conditions) ? c.conditions.join(" ") : c.conditions) || ""
                        };

                        // Objet JSON 1 : DEPART
                        const jsonDepart = {
                            ...infosCourse,
                            partants: participantsInfo
                        };

                        // Objet JSON 2 : ARRIVEE
                        const jsonArrivee = {
                            id: `R${r}C${c.numOrdre}`,
                            date: date,
                            arrivee: c.ordreArrivee || [],
                            nombre_partants: participantsInfo.length,
                            rapports_trio: filterTrios(rap)
                        };

                        // Stockage
                        DATA_DEPART.push(jsonDepart);
                        DATA_ARRIVEE.push(jsonArrivee);

                        renderMinimalCard(jsonArrivee, jsonDepart, thresh);
                    }
                }
            }
        }
    } catch (err) {
        log("Err: " + err.message);
    } finally {
        RUNNING = false;
        el("scanBtn").style.display = "block";
        el("stopBtn").style.display = "none";
        el("dlStarts").disabled = false;
        el("dlFinishes").disabled = false;
        log("Terminé.");
    }
};

el("stopBtn").onclick = () => RUNNING = false;

// --- EXPORT GLOBAL ---
el("dlStarts").onclick = () => downloadJSON(DATA_DEPART, "PMU_DEPARTS.json");
el("dlFinishes").onclick = () => downloadJSON(DATA_ARRIVEE, "PMU_ARRIVEES.json");


// --- RENDER UI ---
function renderMinimalCard(arriveeObj, departObj, thresh) {
    const div = document.createElement("div");
    div.className = "race-card";

    // Calcul du gain max (CORRECTION ICI : On lit la valeur déjà nettoyée)
    let maxGain = 0;
    arriveeObj.rapports_trio.forEach(t => {
        t.rapports.forEach(g => {
            // Ici on lit 'gain_pour_1_euro' qui vient de filterTrios()
            let val = g.gain_pour_1_euro;
            if (val > maxGain) maxGain = val;
        });
    });

    const arriveeTxt = arriveeObj.arrivee.length > 0 ? arriveeObj.arrivee.join(" - ") : "Non disponible";
    const dateFmt = `${departObj.date.substring(0,2)}/${departObj.date.substring(2,4)}`;

    div.innerHTML = `
        <div class="race-header">
            <span>${dateFmt} - ${departObj.hippodrome} - ${departObj.id}</span>
        </div>
        
        <div class="result-line">
            Arrivée: ${arriveeTxt}
            <div style="font-size:0.8em; font-weight:normal; margin-top:3px;">
                Partants: ${arriveeObj.nombre_partants}
            </div>
        </div>
        
        <div class="trio-highlight">
            Trio Max: ${maxGain.toFixed(2)} €
        </div>

        <div class="card-actions">
            <button class="btn-mini copy-start" onclick='copyData(${JSON.stringify(departObj)}, this)'>Copier Départ</button>
            <button class="btn-mini copy-end" onclick='copyData(${JSON.stringify(arriveeObj)}, this)'>Copier Arrivée</button>
        </div>
    `;
    el("resultsContainer").appendChild(div);
}


// --- UTILS COPY/DOWNLOAD ---

window.copyData = function(dataObj, btnElement) {
    const jsonStr = JSON.stringify(dataObj, null, 2);
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(jsonStr).then(() => {
            flashBtn(btnElement, "Copié !");
        }).catch(err => {
            fallbackCopy(jsonStr, btnElement);
        });
    } else {
        fallbackCopy(jsonStr, btnElement);
    }
};

function fallbackCopy(text, btn) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
        document.execCommand('copy');
        flashBtn(btn, "Copié !");
    } catch (err) {}
    document.body.removeChild(textArea);
}

function flashBtn(btn, msg) {
    const originalText = btn.innerText;
    btn.innerText = msg;
    setTimeout(() => btn.innerText = originalText, 1500);
}

function downloadJSON(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// --- API & LOGIC ---

async function fetchSafe(url) {
    for (const proxy of PROXIES) {
        try {
            const res = await fetch(proxy + encodeURIComponent(url));
            if (res.status === 404) return null;
            if (!res.ok) throw new Error("Http");
            const text = await res.text();
            if (!text || text.trim().startsWith("<")) continue;
            return JSON.parse(text);
        } catch (e) { }
    }
    return null;
}

function hasTrio(r) {
    return r && Array.isArray(r) && r.some(x => x.typePari.includes("TRIO") || x.typePari.includes("TIERCE"));
}

function isHighTrio(r, thresh) {
    if (!r) return false;
    const bets = r.filter(x => x.typePari.includes("TRIO") || x.typePari.includes("TIERCE"));
    for (const bet of bets) {
        for (const g of bet.rapports) {
            let val = g.dividendePourUnEuro ? g.dividendePourUnEuro/100 : g.dividende/((bet.miseBase||100));
            if (val >= thresh) return true;
        }
    }
    return false;
}

// Nettoyage des rapports pour JSON Sortie
function filterTrios(rapportsFull) {
    const targets = rapportsFull.filter(x => x.typePari.includes("TRIO") || x.typePari.includes("TIERCE"));
    return targets.map(t => ({
        type: t.typePari,
        mise_base: t.miseBase,
        rapports: t.rapports.map(g => ({
            combinaison: g.combinaison,
            // C'est ici qu'on calcule la valeur propre pour le JSON de sortie
            gain_pour_1_euro: g.dividendePourUnEuro ? g.dividendePourUnEuro/100 : g.dividende/((t.miseBase||100))
        }))
    }));
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function getDates(start, end) {
    const parse = d => new Date(d.substring(4), d.substring(2,4)-1, d.substring(0,2));
    const fmt = d => String(d.getDate()).padStart(2,'0') + String(d.getMonth()+1).padStart(2,'0') + d.getFullYear();
    let curr = parse(start);
    const last = parse(end);
    const list = [];
    while (curr <= last) { list.push(fmt(curr)); curr.setDate(curr.getDate() + 1); }
    return list;
}

</script>
</body>
</html>
