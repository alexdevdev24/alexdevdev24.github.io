<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️🥺</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for futuristic look -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HUD / Sticky Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="app-title">MIR 2025 // SIMULATION</h1>
            <div class="score-hud">
                <div class="hud-item total">PTS: <span id="hud-score">0</span></div>
                <div class="hud-item success" style="color: var(--neon-green)">✓ <span id="hud-correct">0</span></div>
                <div class="hud-item error" style="color: var(--neon-red)">✗ <span id="hud-incorrect">0</span></div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Questions injected here by JS -->
        <div id="quiz-container">
            <!-- Dynamic Content -->
        </div>

        <!-- Controls Area -->
        <div class="controls-area" id="controls-area">
            <button id="action-btn" class="btn-futuristic">START SIMULATION</button>
        </div>
    </div>

    <!-- Data & Logic -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
